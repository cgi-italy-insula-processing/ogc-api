openapi: 3.0.0
info:
   version: "0.1"
   title: "OGC API - Processes"
   description: |-
      Example API Definition for OGC API - Processes
   contact:
      name: Open Geospatial Consortium
      email: info@ogc.org
   license:
      name: OGC License
      url: http://www.opengeospatial.org/legal/
servers:
   - description: |-
        Example Server 1 (GNOSIS, supporting Part 1: Core /Sync and Part 3: Workflows)
     url: https://maps.gnosis.earth/ogcapi
paths:
   # OGC API - Common - Part 1: Core
   /:
      $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/paths/common-core/pLandingPage.yaml"
   /conformance:
      $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/paths/common-core/pConformance.yaml"
   /api:
      $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/paths/common-core/pAPI.yaml"

   # OGC API - Processes - Part 1: Core
   /processes:
      # OGC API - Processes Part 2: Deploy, Replace, Undeploy
      $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/paths/processes-dru/pProcessListDeploy.yaml"

   /processes/{processId}:
      # OGC API - Processes Part 2: Deploy, Replace, Undeploy
      $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/paths/processes-dru/pProcessDescriptionReplaceUndeploy.yaml"

   /processes/{processId}/package:
      # OGC API - Processes Part 2: Deploy, Replace, Undeploy
      $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/paths/processes-dru/pPackage.yaml"

   /processes/{processId}/execution:
      $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/paths/processes-core/pExecution.yaml"

   # OGC API - Processes - Part 1: Core (Jobs, required for ASync execution)
   /jobs:
      $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/paths/processes-core/pJobsList.yaml"

   /jobs/{jobId}:
      $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/paths/processes-core/pJob.yaml"

   /jobs/{jobId}/results:
      $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/paths/processes-core/pJobResults.yaml"

   /jobs/{jobId}/results/{outputId}:
      $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/paths/processes-core/pOutputResult.yaml"

