      Conformance:
         $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/responses/common-core/rConformance.yaml"
      API:
         $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/responses/common-core/rAPI.yaml"

      # Processes - Core
      ProcessList:
         $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/responses/processes-core/rProcessList.yaml"
      ProcessDescription:
         $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/responses/processes-core/rProcessDescription.yaml"
      Results:
         $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/responses/processes-core/rResults.yaml"
      Status:
         $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/responses/processes-core/rStatus.yaml"
      JobList:
         $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/responses/processes-core/rJobList.yaml"
