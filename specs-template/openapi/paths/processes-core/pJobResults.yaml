get:
  summary: retrieve the result(s) of a job
  description: |
    Lists available results of a job. In case of a failure, lists exceptions instead.
    
    For more information, see [Section 7.11](https://docs.ogc.org/is/18-062r2/18-062r2.html#sc_retrieve_job_results).
  operationId: getResult
  tags:
    - Jobs
  parameters:
    - $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/parameters/processes-core/jobId.yaml"
  responses:
    200:
      $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/responses/processes-core/rResults.yaml"
    404:
      $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/responses/common-core/rNotFound.yaml"
    500:
      $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/responses/common-core/rServerError.yaml"
