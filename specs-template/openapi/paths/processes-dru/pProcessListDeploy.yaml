get:
  summary: retrieve the list of available processes
  description: |
    The list of processes contains a summary of each process the OGC API - Processes offers, including the link to a more detailed description of the process.
    
    For more information, see [Section 7.7]https://docs.ogc.org/is/18-062r2/18-062r2.html#sc_process_list).
  operationId: getProcesses
  tags:
    - Processes
  parameters:
    - $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/parameters/processes-core/limit.yaml"
  responses:
    200:
      $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/responses/processes-core/rProcessList.yaml"
post:
  summary: deploy a process.
  description: |
    Deploys a process.

    For more information, see [Section 6.3](http://docs.ogc.org/DRAFTS/20-044.html#_87a6983e-d060-458c-95ab-27e232e64822).
  operationId: deploy
  tags:
    - DRU
  requestBody:
    description: |-
      An OGC Application Package used to deploy a new process.
    required: true
    content:
      application/ogcapppkg+json:
        schema:
          $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/schemas/processes-dru/ogcapppkg.yaml"
  responses:
    201:
      $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/responses/processes-core/rProcessSummary.yaml"
    400:
      $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/responses/common-core/rNotFound.yaml"
    403:
      $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/responses/processes-dru/rImmutableProcess.yaml"
    409:
      $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/responses/processes-dru/rDuplicateProcess.yaml"
    500:
      $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/responses/common-core/rServerError.yaml"
