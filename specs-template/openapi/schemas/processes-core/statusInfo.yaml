allOf:
  - $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/schemas/processes-core/descriptionType.yaml"
  - type: object
    required:
      - id
      - status
      - type
    properties:
      id:
        type: string
      processID:
        type: string
        format: uri
      type:
        type: string
        example:
          - process
          - wps
          - openeo
      request:
        oneOf:
          - type: string
          - type: object
          - $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/schemas/common-core/link.yaml"
      status:
        $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/schemas/processes-core/statusCode.yaml"
      message:
        type: string
      exception:
        $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/schemas/common-core/exception.yaml"
      created:
        type: string
        format: date-time
      started:
        type: string
        format: date-time
      finished:
        type: string
        format: date-time
      updated:
        type: string
        format: date-time
      progress:
        type: integer
        minimum: 0
        maximum: 100
      links:
        type: array
        items:
          $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/schemas/common-core/link.yaml"