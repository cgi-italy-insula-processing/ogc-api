# Process Description
get:
  summary: retrieve a process description
  description:  |
    The process description contains information about inputs and outputs and a link to the execution-endpoint for the process. The Core does not mandate the use of a specific process description to specify the interface of a process. That said, the Core requirements class makes the following recommendation:
    
    Implementations SHOULD consider supporting the OGC process description.
    
    For more information, see [Section 7.8](https://docs.ogc.org/is/18-062r2/18-062r2.html#sc_process_description).
  operationId: getProcessDescription
  tags:
    - Processes
  parameters:
    - $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/parameters/processes-core/processId-path.yaml"
  responses:
    200:
      $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/responses/processes-core/rProcessDescription.yaml"
    404:
      $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/responses/common-core/rNotFound.yaml"
put:
  summary: replace a process.
  description: |
    Replaces a process.
    
    For more information, see [Section 6.4](http://docs.ogc.org/DRAFTS/20-044.html#_18582f42-ebc6-4284-9333-c089068f62b6).
  operationId: replace
  tags:
    - DRU
  parameters:
    - $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/parameters/processes-core/processId-path.yaml"
  requestBody:
    description: |-
      An OGC Application Package used to deploy a new process.
    required: true
    content:
      application/ogcapppkg+json:
        schema:
          $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/schemas/processes-dru/ogcapppkg.yaml"
  responses:
    204:
      $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/responses/processes-core/rEmpty.yaml"
    400:
      $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/responses/common-core/rNotFound.yaml"
    403:
      $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/responses/processes-dru/rImmutableProcess.yaml"
    404:
      $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/responses/common-core/rNotFound.yaml"
    409:
      $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/responses/processes-dru/rDuplicateProcess.yaml"
    500:
      $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/responses/common-core/rServerError.yaml"
delete:
  summary: undeploy a process.
  description: |
    Undeploys a process.
    
    For more information, see [Section 6.5](http://docs.ogc.org/DRAFTS/20-044.html#_16391f9e-538f-4a84-9710-72a6bab82842).
  operationId: undeploy
  tags:
    - DRU
  parameters:
    - $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/parameters/processes-core/processId-path.yaml"
  responses:
    204:
      $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/responses/processes-core/rEmpty.yaml"
    403:
      $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/responses/processes-dru/rImmutableProcess.yaml"
    404:
      $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/responses/common-core/rNotFound.yaml"
    500:
      $ref: "_OGC_API_PROCESSES_SPECS_ROOT_/responses/common-core/rServerError.yaml"